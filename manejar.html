<!DOCTYPE html>
<!--
  manejAr v2.0.1 — 2026-10-24
  Control de ganancias real para choferes de Uber / Didi / Cabify.
  Stack: single-file HTML + Firebase compat + GitHub Pages. Service worker: sw-manejar.js (raíz del repo). Sin Netlify.

  v2.0.1: configuración Firebase real (proyecto manejar-dfdd4). PENDIENTE: número de WhatsApp (const WHATSAPP).

  CUENTAS Y VENTA (v2.0.0)
  - Login email + contraseña (Firebase Auth). Al registrarse: demo gratis de 14 días. Al vencer: pantalla de bloqueo.
  - Estados de cuenta en Firestore usuarios/{uid}: demo | activo | bloqueado + vence (ms). Lo cambia SOLO el administrador.
  - Cobro MANUAL: el administrador registra el pago (monto + días) desde el panel interno y la cuenta se extiende.
  - Panel interno: tocar el volante (izquierda del logo) + PIN 2580. El permiso real lo da la cuenta administradora
    (rgaraventa@gmail.com con email verificado, validado en las reglas de Firestore), el PIN es solo la puerta visual.
  - Copia de los datos en la nube (usuarios/{uid}/registros) para no perderlos al cambiar de celular.
  - Si Firebase no está configurado (FB con 'REEMPLAZAR') la app corre en modo local, sin cuentas.

  REGLA DE NEGOCIO (v1.2.0): los GASTOS NO entran en ninguna métrica de rendimiento ($/hora, $/km, mejor día/horario, jornada de hoy).
  Esas métricas usan el "ingreso del trabajo" = cobrado − comisión. Los gastos se restan solo en "lo que te queda".

  CHANGELOG
  - 2.0.0: cuentas, demo 14 días, bloqueo, panel interno con registro manual de pagos, volante animado, copia en la nube.
  - 1.2.0: gastos fuera del rendimiento.
  - 1.1.0: Resultados centrado en gráficas.
  - 1.0.0: versión inicial.

  PENDIENTE
  - Reemplazar FB (config Firebase) y WHATSAPP (número de contacto para activar cuentas).
  - Íconos PNG 192/512 + manifest.json real en el repo (hoy se usa ícono SVG embebido).
  - Etapa futura: cobro automático con Mercado Pago (requiere servidor) y app central para manejar todas las cuentas del portfolio.
-->

<script>
'use strict';
/* ====== CONFIG ====== */
const VER='2.0.1', KEY='manejar_v1', ADMIN_PIN='2580', ADMIN_EMAIL='rgaraventa@gmail.com', DAY=864e5, DEMO_DIAS=14;
const FB={apiKey:'AIzaSyBaoM5gbWV5DrRQ7tIUyEPE5oyR6H8hnBw',authDomain:'manejar-dfdd4.firebaseapp.com',projectId:'manejar-dfdd4',storageBucket:'manejar-dfdd4.firebasestorage.app',messagingSenderId:'409587508261',appId:'1:409587508261:web:15e0e6f6f28f18dfd90bcc'};
const FB_ON=FB.apiKey!=='REEMPLAZAR' && typeof firebase!=='undefined';
const WHATSAPP='REEMPLAZAR'; /* número con código de país, ej 5491122334455 */
const PLATS=['Uber','Didi','Cabify','Otro'];
const CAT_COMB=['Nafta','GNC','Diésel'];
const CAT_VAR=['Peaje','Lavado','Mantenimiento','Comida','Otro'];
const DIAS=['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
const DIAS_L=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];

/* ====== ESTADO ====== */
let S={r:[],uid:null,acct:null,cfg:{nombre:'',vehiculo:'',com:{Uber:25,Didi:20,Cabify:20,Otro:0},tema:'dark',lastPlat:'Uber',lastPago:'Efectivo'},flota:{id:null,rol:null}};
try{const x=JSON.parse(localStorage.getItem(KEY)||'null');if(x){S=Object.assign(S,x);S.cfg=Object.assign({},S.cfg,x.cfg||{});S.cfg.com=Object.assign({Uber:25,Didi:20,Cabify:20,Otro:0},(x.cfg||{}).com||{});S.flota=x.flota||{id:null,rol:null};}}catch(e){}
let tab='inicio',per='hoy',fper='hoy',hf='todo',SEL={},FD=[],FM={choferes:{}},unsubA=null,unsubB=null,unsubAcct=null,unsubUL=null,auth=null,db=null,me=null;
let gate=FB_ON?'boot':'app', bmotivo='sin', amode='login', amail='', abusy=false, pendingNombre='', ADMIN_OK=false, pinFails=0, pinLock=0, syncDone=false;
let UL=[],uq='',uf='todo';

/* ====== UTIL ====== */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const fmt=n=>{n=Math.round(n||0);return (n<0?'-':'')+'$'+Math.abs(n).toLocaleString('es-AR');};
const fmtK=n=>{n=Math.round(n);return n>=1000?(n/1000).toFixed(n>=10000?0:1).replace('.0','')+'k':String(n);};
const num=v=>{const n=parseFloat(String(v).replace(',','.'));return isNaN(n)?NaN:n;};
const hhmm=t=>new Date(t).toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'});
const fdate=t=>new Date(t).toLocaleDateString('es-AR',{day:'2-digit',month:'2-digit'})+' '+hhmm(t);
const fday=t=>t?new Date(t).toLocaleDateString('es-AR',{day:'2-digit',month:'2-digit',year:'numeric'}):'—';
const horasStr=ms=>{const m=Math.floor(ms/6e4);return Math.floor(m/60)+'h '+String(m%60).padStart(2,'0')+'m';};
const ago=t=>{if(!t)return 'sin viajes';const m=Math.floor((Date.now()-t)/6e4);return m<1?'recién':m<60?'hace '+m+' min':m<1440?'hace '+Math.floor(m/60)+' h':'hace '+Math.floor(m/1440)+' d';};
const sod=ts=>{const d=new Date(ts);d.setHours(0,0,0,0);return d.getTime();};
const toLocal=ts=>{const d=new Date(ts-new Date(ts).getTimezoneOffset()*6e4);return d.toISOString().slice(0,16);};
const fromLocal=s=>new Date(s).getTime();
function rango(p){const n=Date.now(),s=sod(n);if(p==='hoy')return[s,s+DAY];if(p==='ayer')return[s-DAY,s];if(p==='sem')return[s-6*DAY,s+DAY];const d=new Date(n);d.setDate(1);d.setHours(0,0,0,0);return[d.getTime(),s+DAY];}
function save(){S.upd=Date.now();try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){toast('No se pudo guardar en el teléfono');}}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('show'),2600);}

/* ====== CÁLCULOS ======
   neto = cobrado − comisión de la plataforma  ("ingreso del trabajo")
   gan  = neto − gastos                        ("lo que te queda")  ← NO se usa en gráficas de rendimiento */
function calc(rs,a,b){
  const o={bruto:0,com:0,efec:0,dig:0,comb:0,varios:0,viajes:0,horas:0,km:0,abierta:false,ultimo:0};
  for(const r of rs){
    if(r.t==='j'&&!r.fin)o.abierta=true;
    if(r.ts<a||r.ts>=b)continue;
    if(r.t==='v'){o.viajes++;o.bruto+=r.monto;o.com+=r.comMonto||0;if(r.pago==='Efectivo')o.efec+=r.monto;else o.dig+=r.monto;if(r.ts>o.ultimo)o.ultimo=r.ts;}
    else if(r.t==='g'){if(r.sub==='Combustible')o.comb+=r.monto;else o.varios+=r.monto;}
    else if(r.t==='j'){o.horas+=Math.max(0,((r.fin||Date.now())-r.inicio)/36e5);if(r.fin&&r.kmFin>=r.kmIni)o.km+=r.kmFin-r.kmIni;}
  }
  o.gastos=o.comb+o.varios;o.neto=o.bruto-o.com;o.gan=o.neto-o.gastos;
  o.efecMano=o.efec-o.gastos;o.digCobrar=o.dig-o.com;
  o.ph=o.horas>0.05?o.neto/o.horas:0;o.pk=o.km>0?o.neto/o.km:0;
  return o;
}
const MET={
  gan:{n:'Ingreso del trabajo',f:c=>c.neto,fm:fmt,ok:c=>c.viajes>0},
  hora:{n:'Ingreso por hora',f:c=>c.ph,fm:v=>fmt(v)+'/h',ok:c=>c.horas>0.05&&c.viajes>0},
  km:{n:'Ingreso por km',f:c=>c.pk,fm:v=>fmt(v)+'/km',ok:c=>c.km>0&&c.viajes>0},
  via:{n:'Viajes',f:c=>c.viajes,fm:v=>String(Math.round(v)),ok:c=>c.viajes>0}
};
function serie(k,dias){const s=sod(Date.now()),out=[];for(let i=dias-1;i>=0;i--){const a=s-i*DAY,c=calc(S.r,a,a+DAY);out.push({l:DIAS[new Date(a).getDay()],v:MET[k].ok(c)?MET[k].f(c):0,hi:i===0,ok:MET[k].ok(c),a});}return out;}
function promSerie(ser){const o=ser.filter(x=>x.ok);return o.length?o.reduce((s,x)=>s+x.v,0)/o.length:0;}
function porDiaSemana(k){const s=sod(Date.now()),sum=Array(7).fill(0),n=Array(7).fill(0);
  for(let i=0;i<56;i++){const a=s-i*DAY,c=calc(S.r,a,a+DAY);if(MET[k].ok(c)){const d=new Date(a).getDay();sum[d]+=MET[k].f(c);n[d]++;}}
  return DIAS.map((l,d)=>({l,v:n[d]?sum[d]/n[d]:0,n:n[d]}));}
function horarios(){const from=Date.now()-60*DAY,inc=Array(24).fill(0),wk=Array(24).fill(0);
  for(const r of S.r){if(r.ts<from)continue;
    if(r.t==='v')inc[new Date(r.ts).getHours()]+=r.monto-(r.comMonto||0);
    else if(r.t==='j'){let t=r.inicio;const f=r.fin||Date.now();while(t<f){const d=new Date(t),nx=new Date(t);nx.setMinutes(0,0,0);nx.setHours(d.getHours()+1);const e=Math.min(nx.getTime(),f);wk[d.getHours()]+=(e-t)/36e5;t=e;}}}
  return inc.map((v,h)=>({h,ph:wk[h]>=1?v/wk[h]:null,hrs:wk[h]}));}
function franjas(){return horarios().filter(x=>x.ph!==null).sort((a,b)=>b.ph-a.ph);}
function horasHoy(){const s=sod(Date.now()),inc={};let min=24,max=-1;
  for(const r of S.r){if(r.ts<s||r.ts>=s+DAY)continue;
    if(r.t==='v'){const h=new Date(r.ts).getHours();inc[h]=(inc[h]||0)+r.monto-(r.comMonto||0);min=Math.min(min,h);max=Math.max(max,h);}
    else if(r.t==='j'){const h=new Date(r.inicio).getHours();min=Math.min(min,h);max=Math.max(max,r.fin?new Date(r.fin).getHours():new Date().getHours());}}
  if(max<0)return [];const out=[];let bh=-1,bv=0;for(let h=min;h<=max;h++)if((inc[h]||0)>bv){bv=inc[h];bh=h;}
  for(let h=min;h<=max;h++)out.push({l:String(h),v:inc[h]||0,hi:h===bh});return out;}
function ritmo(k){const s=sod(Date.now()),hoy=calc(S.r,s,s+DAY);let sum=0,n=0;
  for(let i=1;i<=7;i++){const a=s-i*DAY,c=calc(S.r,a,a+DAY);if(MET[k].ok(c)){sum+=MET[k].f(c);n++;}}
  return {v:MET[k].f(hoy),avg:n?sum/n:0,n,ok:MET[k].ok(hoy)&&hoy.horas>=0.25,hoy};}
function jornadaAbierta(){return S.r.find(r=>r.t==='j'&&!r.fin);}
function ultimoKm(){const j=S.r.filter(r=>r.t==='j'&&r.fin).sort((a,b)=>b.ts-a.ts)[0];return j?j.kmFin:'';}

/* ====== GRÁFICOS ====== */
function bars(items,fm,opt){opt=opt||{};const n=items.length,mx=Math.max(1,...items.map(i=>Math.max(0,i.v)),opt.avg||0);
  const cols=items.map(i=>{const p=Math.max(0,i.v)/mx*100;const show=i.v>0&&(n<=8||i.hi);
    return `<div class="bw"><span class="bv" style="bottom:calc(${p}% + 3px)">${show?esc(fm(i.v)):''}</span><div class="bb ${i.hi?'hi':''}" style="height:${i.v>0?Math.max(p,2):0}%"></div></div>`;}).join('');
  const labs=items.map(i=>`<div class="bl">${esc(i.l)}</div>`).join('');
  const avg=opt.avg>0?`<div class="avg" style="bottom:${opt.avg/mx*100}%"><span>prom. ${esc(fm(opt.avg))}</span></div>`:'';
  return `<div class="chart"><div class="plot">${cols}${avg}</div><div class="labs">${labs}</div></div>`;}
function donut(c){if(c.bruto<=0)return '<div class="donut" style="background:var(--card2)"></div>';
  const pc=c.com/c.bruto*100,pg=c.gastos/c.bruto*100,pn=Math.max(0,100-pc-pg);
  return `<div class="donut" style="background:conic-gradient(var(--amb) 0 ${pc}%,var(--red) ${pc}% ${pc+pg}%,var(--ac) ${pc+pg}% ${pc+pg+pn}%)"></div>`;}
function delta(r,fm){if(!r.ok)return '<span class="mut">se calcula con más datos</span>';
  let d='';if(r.avg>0){const p=(r.v-r.avg)/r.avg*100;d=` <span class="${p>=0?'pos':'neg'}" style="font-weight:700">${p>=0?'▲':'▼'} ${Math.abs(p).toFixed(0)}%</span>`;}
  return `<span class="mut">prom. 7 días ${r.avg>0?fm(r.avg):'—'}</span>${d}`;}

function delRec(id){const r=S.r.find(x=>x.id===id);if(!r)return;if(!confirm('¿Eliminar este registro?'))return;S.r=S.r.filter(x=>x.id!==id);save();dropRec(id);closeSheet();render();toast('Eliminado');}
const delBtn=id=>id?`<button class="btn red" onclick="delRec('${id}')">Eliminar</button>`:'';
const tsField=r=>r?`<label>Fecha y hora</label><input type="datetime-local" id="f_ts" value="${toLocal(r.ts)}">`:'';

  SEL.plat=r?r.plat:S.cfg.lastPlat;SEL.pago=r?r.pago:S.cfg.lastPago;
  sheet(`<h3>${r?'Editar viaje':'Nuevo viaje'}</h3><label>Importe cobrado</label>

function saveViaje(id){const monto=num($('#f_monto').value);if(!(monto>0))return toast('Ingresá el importe');

function openGasto(sub,id){const r=id?S.r.find(x=>x.id===id):null;sub=r?r.sub:sub;const comb=sub==='Combustible';
  SEL.cat=r?r.cat:(comb?CAT_COMB[0]:CAT_VAR[0]);

function openEditJ(id){const j=S.r.find(x=>x.id===id);

function saveEditJ(id){const ini=fromLocal($('#f_ini').value),ki=num($('#f_ki').value),finS=$('#f_fin').value,kf=num($('#f_kf').value);

  upsert({id,t:'j',ts:ini,inicio:ini,kmIni:ki,fin,kmFin});closeSheet();render();}
function openEdit(id){const r=S.r.find(x=>x.id===id);if(!r)return;if(r.t==='v')openViaje(id);else if(r.t==='g')openGasto(r.sub,id);else openEditJ(id);}

/* ====== DETALLE DE MÉTRICA ====== */
function openMetric(k){
  const M=MET[k],s=sod(Date.now()),hoy=calc(S.r,s,s+DAY),ayer=calc(S.r,s-DAY,s);
  const vh=M.f(hoy),va=M.f(ayer);
  let cmp='<span class="mut">Todavía no hay datos suficientes hoy para comparar con ayer</span>';
  if(M.ok(hoy)&&M.ok(ayer)&&va>0){const d=(vh-va)/va*100;cmp=`<b class="${d>=0?'pos':'neg'}">${d>=0?'▲':'▼'} ${Math.abs(d).toFixed(0)}%</b> <span class="mut">vs ayer (${M.fm(va)})</span>`;}
  const ser=serie(k,7),dw=porDiaSemana(k),best=dw.filter(x=>x.n>0).sort((a,b)=>b.v-a.v)[0];
  const okSer=ser.filter(x=>x.ok).sort((a,b)=>b.v-a.v)[0];
  let extra='';
  if(best)extra+=`<div class="row"><span>🏆 Mejor día de la semana</span><b>${DIAS_L[DIAS.indexOf(best.l)]} · ${M.fm(best.v)}</b></div>`;
  if(okSer)extra+=`<div class="row"><span>⭐ Mejor día de estos 7</span><b>${DIAS_L[new Date(okSer.a).getDay()]} · ${M.fm(okSer.v)}</b></div>`;
  let fr='';
  if(k==='hora'){const f=franjas();if(f.length){fr=`<div class="card" style="margin-top:12px"><b>Mejores franjas horarias</b><div class="mut" style="margin-bottom:6px">Ingreso por hora trabajada (después de comisiones, sin gastos), últimos 60 días</div>`+
    f.slice(0,3).map((x,i)=>`<div class="row"><span>${['🥇','🥈','🥉'][i]} ${x.h}–${(x.h+1)%24} hs</span><b>${fmt(x.ph)}/h</b></div>`).join('')+
    (f.length>3?`<div class="row"><span class="mut">Peor franja: ${f[f.length-1].h}–${(f[f.length-1].h+1)%24} hs</span><span class="mut">${fmt(f[f.length-1].ph)}/h</span></div>`:'')+'</div>';}
    else fr='<p class="mut">Necesitás algunas jornadas con viajes para ver las mejores franjas.</p>';}
  if(k==='km'){const w=[...ser].filter(x=>x.ok).sort((a,b)=>a.v-b.v)[0];if(w&&okSer&&w!==okSer)extra+=`<div class="row"><span>📉 Día más flojo (7 días)</span><b>${DIAS_L[new Date(w.a).getDay()]} · ${M.fm(w.v)}</b></div>`;}
  const f1=v=>k==='via'?String(Math.round(v)):fmtK(v);
  const nota=k==='via'?'':'<div class="cap" style="margin-top:8px">Después de comisiones de la plataforma. Los gastos (combustible, peajes) no se descuentan acá: se ven en “Lo que te queda”.</div>';
  sheet(`<h3>${M.n}</h3><div class="big ${vh<0?'neg':''}">${M.fm(vh)}</div><div class="mut">hoy (en curso)</div><div style="margin-top:4px">${cmp}</div>${nota}
  <div class="card" style="margin-top:12px"><b>Últimos 7 días</b>${bars(ser,f1,{avg:promSerie(ser)})}</div>
  <div class="card"><b>Promedio por día de la semana</b><div class="mut">Últimas 8 semanas</div>${bars(dw.map(x=>({l:x.l,v:x.v,hi:!!best&&x.l===best.l})),k==='via'?(v=>v.toFixed(0)):fmtK)}</div>
  ${extra?`<div class="card">${extra}</div>`:''}${fr}<button class="btn sec" onclick="closeSheet()">Cerrar</button>`);
}

/* ====== CUENTA / ACCESO ====== */
function esAdminCuenta(){return !!(me&&me.email&&me.email.toLowerCase()===ADMIN_EMAIL);}
function acceso(){
  if(esAdminCuenta())return {ok:true,tipo:'admin'};
  const a=S.acct;if(!a)return {ok:false,motivo:'sin'};
  if(a.estado==='bloqueado')return {ok:false,motivo:'bloqueado'};
  if(!a.vence||Date.now()>=a.vence)return {ok:false,motivo:a.estado==='demo'?'demo':'vencida'};
  return {ok:true,tipo:a.estado,dias:Math.ceil((a.vence-Date.now())/DAY)};}
function evaluarAcceso(){
  if(!me){gate='auth';render();return;}
  const a=acceso();
  if(a.ok){const era=gate;gate='app';if(era!=='app'&&!syncDone){syncDone=true;syncNube();if(S.flota.id){listenFlota();if(S.flota.rol==='driver')syncAll();}}}
  else{gate='block';bmotivo=a.motivo;}
  render();}
function stopAcct(){if(unsubAcct){unsubAcct();unsubAcct=null;}if(unsubUL){unsubUL();unsubUL=null;}if(unsubA){unsubA();unsubA=null;}if(unsubB){unsubB();unsubB=null;}}
async function fbInit(){
  if(!FB_ON)return;
  try{firebase.initializeApp(FB);auth=firebase.auth();db=firebase.firestore();
    db.enablePersistence({synchronizeTabs:true}).catch(()=>{});
    auth.onAuthStateChanged(onAuth);
    setTimeout(()=>{if(gate==='boot')evaluarAcceso();},9000);
  }catch(e){console.warn('Firebase no disponible',e);gate='block';bmotivo='sin';render();}
}
function onAuth(u){
  me=u;stopAcct();syncDone=false;
  if(!u){S.acct=null;ADMIN_OK=false;save();gate='auth';render();return;}
  amode='login';tab='inicio';
  if(S.uid&&S.uid!==u.uid){S.r=[];S.acct=null;S.flota={id:null,rol:null};}
  S.uid=u.uid;save();
  if(esAdminCuenta()){evaluarAcceso();}
  listenAcct(u);}
function listenAcct(u){
  const ref=db.collection('usuarios').doc(u.uid);let creando=false;
  unsubAcct=ref.onSnapshot(async sn=>{
    if(!sn.exists){
      if(sn.metadata&&sn.metadata.fromCache)return;
      if(creando)return;creando=true;
      try{await ref.set({email:u.email,nombre:pendingNombre||S.cfg.nombre||'',estado:'demo',vence:Date.now()+DEMO_DIAS*DAY,creado:Date.now()});}catch(e){console.warn(e);}
      creando=false;return;}
    S.acct=sn.data();save();evaluarAcceso();
  },err=>{console.warn(err);evaluarAcceso();});}
async function verificarPago(){
  if(!db||!me)return;toast('Verificando…');
  try{const sn=await db.collection('usuarios').doc(me.uid).get({source:'server'});if(sn.exists){S.acct=sn.data();save();}evaluarAcceso();
    if(gate==='block')toast('Todavía no figura tu activación');}catch(e){toast('Sin conexión. Probá de nuevo con internet.');}}
function authMsg(e){const c=(e&&e.code)||'';
  if(/invalid-credential|wrong-password|user-not-found|invalid-login/.test(c))return 'Email o contraseña incorrectos';
  if(/email-already/.test(c))return 'Ese email ya tiene cuenta. Probá ingresar.';
  if(/weak-password/.test(c))return 'La contraseña debe tener al menos 6 caracteres';
  if(/invalid-email/.test(c))return 'El email no es válido';
  if(/network/.test(c))return 'Sin conexión. Probá de nuevo con internet.';
  if(/too-many/.test(c))return 'Demasiados intentos. Esperá unos minutos.';
  return 'No se pudo completar. Probá de nuevo.';}
function setAmode(m){const e=$('#a_mail');if(e)amail=e.value;amode=m;render();}
async function authGo(){
  if(abusy||!auth)return;
  const mail=($('#a_mail').value||'').trim(),pass=$('#a_pass')?$('#a_pass').value:'';amail=mail;
  if(!mail)return toast('Ingresá tu email');
  abusy=true;
  try{
    if(amode==='rec'){await auth.sendPasswordResetEmail(mail);toast('Te enviamos un email para cambiar la contraseña');amode='login';render();}
    else if(amode==='reg'){if(pass.length<6){abusy=false;return toast('La contraseña debe tener al menos 6 caracteres');}
      pendingNombre=($('#a_nom').value||'').trim().slice(0,30);if(pendingNombre&&!S.cfg.nombre){S.cfg.nombre=pendingNombre;save();}
      const cr=await auth.createUserWithEmailAndPassword(mail,pass);try{cr.user.sendEmailVerification();}catch(e){}toast('¡Cuenta creada! Tenés '+DEMO_DIAS+' días gratis');}
    else{if(!pass){abusy=false;return toast('Ingresá tu contraseña');}await auth.signInWithEmailAndPassword(mail,pass);}
  }catch(e){toast(authMsg(e));}
  abusy=false;}
function salir(){if(!auth)return;if(!confirm('¿Cerrar sesión?'))return;auth.signOut().catch(()=>{});closeSheet();}
function cambiarPass(){if(!auth||!me)return;auth.sendPasswordResetEmail(me.email).then(()=>toast('Te enviamos un email para cambiar la contraseña')).catch(e=>toast(authMsg(e)));}
function contactoHtml(){
  const msg='Hola, quiero activar mi cuenta de manejAr. Mi email: '+(me?me.email:'');
  if(WHATSAPP!=='REEMPLAZAR')return `<a class="btn" target="_blank" rel="noopener" href="https://wa.me/${WHATSAPP}?text=${encodeURIComponent(msg)}">Activar por WhatsApp</a>`;
  return `<div class="card" style="margin-bottom:12px"><div class="mut">Para activar tu cuenta escribinos a</div><b style="word-break:break-all">${esc(ADMIN_EMAIL)}</b><div class="mut" style="margin-top:4px">Indicá el email con el que te registraste${me?': '+esc(me.email):''}.</div></div>`;}

function vBlock(){
  const t={demo:['Terminó tu prueba gratis','Para seguir usando manejAr activá tu cuenta.'],vencida:['Tu suscripción venció','Renová para seguir viendo tus ganancias.'],bloqueado:['Tu cuenta está pausada','Escribinos para resolverlo.'],sin:['No pudimos verificar tu cuenta','Conectate a internet y probá de nuevo.']}[bmotivo]||['Cuenta no disponible',''];
  return `<div class="auth"><div class="card"><div style="font-size:44px">${bmotivo==='sin'?'📡':'🔒'}</div><h3 style="margin:6px 0 4px;font-size:22px">${t[0]}</h3><div class="mut" style="margin-bottom:14px">${t[1]}</div>
  ${bmotivo==='sin'?'':contactoHtml()}

  <div class="mut" style="margin:6px 0 10px;text-align:center">Tus datos siguen guardados${me?' en la cuenta '+esc(me.email):''}.</div>
  <button class="link" onclick="salir()">Cerrar sesión</button></div></div>`;}
function bannerCuenta(){
  if(!FB_ON||esAdminCuenta())return '';const a=acceso();if(!a.ok)return '';
  if(a.tipo==='demo')return `<div class="banner red"><span>Prueba gratis: te ${a.dias===1?'queda 1 día':'quedan '+a.dias+' días'}</span><button class="btn sm" style="background:#fff;color:#7f1d1d" onclick="openPlan()">Activar</button></div>`;
  if(a.tipo==='activo'&&a.dias<=5)return `<div class="banner amb"><span>Tu cuenta vence en ${a.dias===1?'1 día':a.dias+' días'}</span><button class="btn sm" style="background:#2b1a00;color:#fff" onclick="openPlan()">Renovar</button></div>`;
  return '';}
function openPlan(){sheet(`<h3>Activar mi cuenta</h3><p class="mut">Una vez que abonás, activamos tu cuenta y se suman los días de tu plan.</p>${contactoHtml()}<button class="btn sec" onclick="closeSheet()">Cerrar</button>`);}

function bloqueGraficas(){
  const s=sod(Date.now()),hoy=calc(S.r,s,s+DAY),rh=ritmo('hora'),rk=ritmo('km'),hh=horasHoy(),jo=jornadaAbierta();
  const kmNota=(!rk.ok&&jo&&hoy.km===0)?'<div class="mut" style="margin-top:2px">se calcula al cerrar la jornada</div>':'';
  let c1=`<div class="card"><div class="jc"><h4>Tu jornada de hoy</h4><span class="mut">${hoy.horas>0.05?hoy.horas.toFixed(1)+' h':''}</span></div>
    <div class="kpis"><div class="kpi"><span class="mut">Por hora</span><b>${rh.ok?fmt(rh.v)+'/h':'—'}</b>${delta(rh,v=>fmt(v)+'/h')}</div>
    <div class="kpi"><span class="mut">Por km</span><b>${rk.ok?fmt(rk.v)+'/km':'—'}</b>${rk.ok?delta(rk,v=>fmt(v)+'/km'):'<span class="mut">sin km todavía</span>'+kmNota}</div></div>`;
  c1+=hh.length?`<div style="margin-top:14px" class="mut">Ingreso por hora del día (después de comisiones)</div>${bars(hh,fmtK)}<div class="cap">Cada barra es una hora de reloj. La verde es tu mejor hora de hoy. Los gastos no se cuentan acá.</div>`
    :`<div class="cap" style="margin-top:12px">Iniciá la jornada y cargá viajes: acá vas a ver cómo viene tu día hora por hora.</div>`;
  c1+='</div>';
  const sH=serie('hora',7),sK=serie('km',7),aH=promSerie(sH),aK=promSerie(sK);
  const c2=`<div class="card tap" onclick="openMetric('hora')"><div class="jc"><h4>Ingreso por hora</h4><span class="mut">7 días ›</span></div>
    ${sH.some(x=>x.ok)?bars(sH,fmtK,{avg:aH}):'<div class="cap">Se arma con tus jornadas y tus viajes.</div>'}<div class="cap">Lo cobrado menos la comisión de la plataforma, dividido por las horas de jornada. No incluye gastos. Tocá para comparar con ayer.</div></div>`;
  const c3=`<div class="card tap" onclick="openMetric('km')"><div class="jc"><h4>Ingreso por km</h4><span class="mut">7 días ›</span></div>
    ${sK.some(x=>x.ok)?bars(sK,v=>fmt(v),{avg:aK}):'<div class="cap">Se arma al cerrar cada jornada con los km del auto.</div>'}<div class="cap">Lo que te paga el trabajo por cada km recorrido, sin contar gastos.</div></div>`;
  const dG=porDiaSemana('gan'),dH=porDiaSemana('hora'),dK=porDiaSemana('km');
  const top=a=>a.filter(x=>x.n>0).sort((x,y)=>y.v-x.v)[0];
  const bG=top(dG),bH=top(dH),bK=top(dK),fr=franjas();
  const dia=x=>x?DIAS_L[DIAS.indexOf(x.l)]:'—';
  const c4=`<div class="card"><h4>Tus mejores momentos</h4><div class="best" style="margin-top:12px">
    <div class="bt"><div class="t">🏆 Mejor día (ingreso)</div><b>${dia(bG)}</b><div class="s">${bG?fmt(bG.v)+' por día':'faltan datos'}</div></div>
    <div class="bt"><div class="t">⏱️ Mejor día por hora</div><b>${dia(bH)}</b><div class="s">${bH?fmt(bH.v)+'/h':'faltan datos'}</div></div>
    <div class="bt"><div class="t">📏 Mejor día por km</div><b>${dia(bK)}</b><div class="s">${bK?fmt(bK.v)+'/km':'faltan datos'}</div></div>
    <div class="bt"><div class="t">🕒 Mejor horario</div><b style="text-transform:none">${fr.length?fr[0].h+' a '+((fr[0].h+1)%24)+' hs':'—'}</b><div class="s">${fr.length?fmt(fr[0].ph)+'/h':'faltan datos'}</div></div></div></div>`;
  const H=horarios(),con=H.filter(x=>x.ph!==null);let c5;
  if(con.length>=2){const mn=Math.min(...con.map(x=>x.h)),mx=Math.max(...con.map(x=>x.h)),bestH=fr[0].h,items=[];
    for(let h=mn;h<=mx;h++){const x=H[h];items.push({l:(mx-mn>11&&(h-mn)%2)?'':String(h),v:x.ph||0,hi:h===bestH});}
    const peor=fr[fr.length-1];
    c5=`<div class="card"><h4>¿En qué horario te va mejor?</h4><div class="mut" style="margin-top:2px">Ingreso por hora trabajada, según la hora del día (últimos 60 días, sin gastos)</div>${bars(items,fmtK)}
    <div class="cap">🥇 ${bestH}–${(bestH+1)%24} hs es tu mejor horario (${fmt(fr[0].ph)}/h)${fr.length>1?` · el más flojo es ${peor.h}–${(peor.h+1)%24} hs (${fmt(peor.ph)}/h)`:''}.</div></div>`;}
  else c5=`<div class="card"><h4>¿En qué horario te va mejor?</h4><div class="cap" style="margin-top:8px">Con unas jornadas cargadas vas a ver en qué horarios del día rendís mejor.</div></div>`;
  const hiD=bG?bG.l:null;
  const c6=bG?`<div class="card"><h4>Ingreso por día de la semana</h4><div class="mut" style="margin-top:2px">Promedio de las últimas 8 semanas, sin gastos</div>${bars(dG.map(x=>({l:x.l,v:x.v,hi:x.l===hiD})),fmtK)}
    <div class="cap">Los ${dia(bG)} son tu mejor día: ${fmt(bG.v)} en promedio.</div></div>`:'';
  return c1+c2+c3+c4+c5+c6;}

  sheet(`<h3 style="word-break:break-all">${esc(u.email)}</h3><div class="mut">${esc(u.nombre||'sin nombre')} · alta ${fday(u.creado)} <span class="st ${s.k}" style="margin-left:6px">${s.t}</span></div>
  <div class="card" style="margin-top:12px"><b>Registrar pago</b><div class="mut">Suma días a partir de hoy o del vencimiento, lo que sea mayor, y deja la cuenta activa.</div>
   <label for="p_monto">Monto cobrado ($)</label><input id="p_monto" type="number" inputmode="decimal" placeholder="$ 0">
   <label>Días que incluye</label>${chips('dias',['30','60','90','365'],'30')}
   <label for="p_nota">Nota (medio de pago, opcional)</label><input id="p_nota" maxlength="60" placeholder="Mercado Pago, transferencia…">
   <button class="btn" onclick="registrarPago('${esc(u.id)}')">Registrar pago y activar</button></div>
  <div class="card"><b>Editar cuenta</b><label>Estado</label>${chips('est',['demo','activo','bloqueado'],SEL.est)}
   <label for="u_vence">Vence el</label><input id="u_vence" type="date" value="${u.vence?toLocal(u.vence).slice(0,10):''}">
   <label for="u_nota">Nota interna</label><input id="u_nota" maxlength="120" value="${esc(u.nota||'')}">
   <button class="btn sec" onclick="guardarUser('${esc(u.id)}')">Guardar cambios</button></div>
  <div class="card"><b>Pagos registrados</b><div id="pagos" class="mut" style="margin-top:6px">Cargando…</div></div>
  <button class="btn sec" onclick="closeSheet()">Cerrar</button>`);
  try{const sn=await db.collection('usuarios').doc(id).collection('pagos').orderBy('ts','desc').limit(10).get();const el=$('#pagos');
    if(el)el.innerHTML=sn.docs.length?sn.docs.map(d=>{const p=d.data();return `<div class="row"><span>${fday(p.ts)} · +${p.dias} d${p.nota?' · '+esc(p.nota):''}</span><b>${fmt(p.monto)}</b></div>`;}).join(''):'Sin pagos registrados.';}
  catch(e){const el=$('#pagos');if(el)el.textContent='No se pudieron leer los pagos.';}}
async function registrarPago(id){
  const u=UL.find(x=>x.id===id);if(!u)return;const monto=num($('#p_monto').value);if(!(monto>=0)||isNaN(monto))return toast('Ingresá el monto cobrado');
  const dias=parseInt(SEL.dias||'30',10),base=Math.max(Date.now(),u.vence||0),vence=base+dias*DAY,nota=($('#p_nota').value||'').slice(0,60);
  try{const ref=db.collection('usuarios').doc(id),bt=db.batch();
    bt.update(ref,{estado:'activo',vence,ultimoPago:Date.now()});
    bt.set(ref.collection('pagos').doc(),{ts:Date.now(),monto,dias,nota});
    await bt.commit();closeSheet();toast('Pago registrado · vence '+fday(vence));}
  catch(e){toast('No se pudo registrar. ¿Verificaste tu email de administrador?');}}
async function guardarUser(id){
  const f=$('#u_vence').value,patch={estado:SEL.est||'demo',nota:($('#u_nota').value||'').slice(0,120)};
  if(f)patch.vence=fromLocal(f+'T23:59:00');
  try{await db.collection('usuarios').doc(id).update(patch);closeSheet();toast('Cambios guardados');}
  catch(e){toast('No se pudo guardar. ¿Verificaste tu email de administrador?');}}

function render(){
  const ow=S.flota.rol==='owner';
  if(FB_ON&&gate!=='app'){
    $('#nav').innerHTML='';$('#rolBadge').style.display='none';
    $('#view').innerHTML=gate==='auth'?vAuth():gate==='block'?vBlock():'<p class="mut" style="text-align:center;margin-top:60px">Cargando…</p>';return;}
  const tabs=[['inicio','🏠','Inicio'],['res','📊','Resultados'],['hist','🕘','Historial']].concat(ow?[['flota','👥','Flota']]:[]).concat(ADMIN_OK&&FB_ON&&esAdminCuenta()?[['admin','🛠️','Cuentas']]:[]).concat([['cfg','⚙️','Ajustes']]);
  if(tab==='flota'&&!ow)tab='inicio';if(tab==='admin'&&!(ADMIN_OK&&esAdminCuenta()))tab='inicio';
  $('#nav').innerHTML=tabs.map(([k,i,l])=>`<button class="${tab===k?'on':''}" onclick="go('${k}')"><i>${i}</i>${l}</button>`).join('');
  $('#rolBadge').textContent=ow?'Dueño':(S.flota.rol==='driver'?'Flota':'');$('#rolBadge').style.display=S.flota.rol?'':'none';
  $('#view').innerHTML=(tab==='admin'?'':bannerCuenta())+({inicio:vInicio,res:vRes,hist:vHist,flota:vFlota,cfg:vCfg,admin:vAdmin}[tab])();
  if(tab==='admin'){renderSum();renderUL();}
}
function saveCfg(){S.cfg.nombre=$('#c_nom').value.trim();S.cfg.vehiculo=$('#c_veh').value.trim();
  for(const p of PLATS){const v=num($('#c_'+p).value);S.cfg.com[p]=(v>=0&&v<=100)?v:S.cfg.com[p];}
  save();if(S.flota.id&&S.flota.rol==='driver')syncAll();toast('Ajustes guardados');render();}

/* ====== EXPORT ====== */
function download(name,txt,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);}
function exportCSV(){const q=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';
  const rows=[['fecha','tipo','detalle','plataforma','pago','monto','comision','neto','km_inicio','km_fin']];
  [...S.r].sort((a,b)=>a.ts-b.ts).forEach(r=>{const f=new Date(r.ts).toISOString();
    if(r.t==='v')rows.push([f,'viaje','',r.plat,r.pago,r.monto,r.comMonto||0,r.monto-(r.comMonto||0),'','']);
    else if(r.t==='g')rows.push([f,r.sub,r.cat+(r.nota?' '+r.nota:''),'','',r.monto,'','','','']);
    else rows.push([f,'jornada','','','','','','',r.kmIni,r.kmFin==null?'':r.kmFin]);});
  download('manejar-'+new Date().toISOString().slice(0,10)+'.csv','﻿'+rows.map(r=>r.map(q).join(',')).join('\n'),'text/csv');}
function backup(){download('manejar-backup-'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify(S),'application/json');}
function copiar(t){(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast('Copiado')).catch(()=>toast('No se pudo copiar'));}

/* ====== NUBE: copia de datos + FLOTA ====== */
async function syncNube(){
  if(!db||!me)return;
  try{const col=db.collection('usuarios').doc(me.uid).collection('registros'),sn=await col.get(),cloud={};
    sn.forEach(d=>{cloud[d.id]=d.data();});let nuevo=false;
    for(const id in cloud){if(!S.r.find(x=>x.id===id)){S.r.push(cloud[id]);nuevo=true;}}
    const sub=S.r.filter(r=>!cloud[r.id]);
    for(let i=0;i<sub.length;i+=400){const bt=db.batch();sub.slice(i,i+400).forEach(r=>bt.set(col.doc(r.id),r));await bt.commit();}
    if(nuevo){save();render();}}catch(e){console.warn('syncNube',e);}}
function genCode(){const c='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let s='';for(let i=0;i<6;i++)s+=c[Math.floor(Math.random()*c.length)];return s;}
async function crearFlota(){if(!db||!me)return toast('Sin conexión con la nube');
  const id=genCode();
  try{await db.collection('flotas').doc(id).set({owner:me.uid,nombre:S.cfg.nombre||'Mi flota',limiteChoferes:2,choferes:{},creada:Date.now()});
    S.flota={id,rol:'owner'};save();listenFlota();render();toast('Flota creada');}
  catch(e){toast('No se pudo crear la flota');}}
async function unirme(){if(!db||!me)return toast('Sin conexión con la nube');
  const code=($('#f_code').value||'').trim().toUpperCase();if(code.length!==6)return toast('El código tiene 6 caracteres');
  try{const ref=db.collection('flotas').doc(code),sn=await ref.get();if(!sn.exists)return toast('Código inexistente');
    const d=sn.data(),ch=d.choferes||{};
    if(!ch[me.uid]&&Object.keys(ch).length>=(d.limiteChoferes||2))return toast('La flota llegó a su límite de choferes');
    await ref.update({['choferes.'+me.uid]:{nombre:S.cfg.nombre||'Chofer',vehiculo:S.cfg.vehiculo||''}});
    S.flota={id:code,rol:'driver'};save();await syncAll();render();toast('Te uniste a la flota');}
  catch(e){toast('No se pudo unir a la flota');}}
function salirFlota(){if(!confirm('¿Salir de la flota? Tus datos siguen en tu teléfono.'))return;
  const id=S.flota.id;if(db&&me&&id)db.collection('flotas').doc(id).update({['choferes.'+me.uid]:firebase.firestore.FieldValue.delete()}).catch(()=>{});
  S.flota={id:null,rol:null};save();render();}
async function quitarChofer(uidC){if(!confirm('¿Quitar a este chofer de la flota?'))return;
  try{await db.collection('flotas').doc(S.flota.id).update({['choferes.'+uidC]:firebase.firestore.FieldValue.delete()});}catch(e){toast('No se pudo quitar');}}
function listenFlota(){if(!db||!S.flota.id)return;if(unsubA)unsubA();if(unsubB)unsubB();
  if(S.flota.rol!=='owner')return;
  const ref=db.collection('flotas').doc(S.flota.id);
  unsubA=ref.onSnapshot(sn=>{if(sn.exists){FM=sn.data();if(tab==='flota'||tab==='cfg')render();}},()=>{});
  const ini=rango('mes')[0];
  unsubB=ref.collection('registros').where('ts','>=',ini).onSnapshot(sn=>{FD=sn.docs.map(d=>d.data());if(tab==='flota')render();},()=>{});}
function pushRec(r){
  if(!db||!me||gate!=='app')return;
  db.collection('usuarios').doc(me.uid).collection('registros').doc(r.id).set(r).catch(()=>{});
  if(S.flota.rol==='driver'&&S.flota.id)db.collection('flotas').doc(S.flota.id).collection('registros').doc(me.uid+'_'+r.id)
    .set(Object.assign({},r,{choferUid:me.uid,choferNombre:S.cfg.nombre||'Chofer',vehiculo:S.cfg.vehiculo||''})).catch(()=>{});}
function dropRec(id){
  if(!db||!me||gate!=='app')return;
  db.collection('usuarios').doc(me.uid).collection('registros').doc(id).delete().catch(()=>{});
  if(S.flota.rol==='driver'&&S.flota.id)db.collection('flotas').doc(S.flota.id).collection('registros').doc(me.uid+'_'+id).delete().catch(()=>{});}
async function syncAll(){if(!db||!me||S.flota.rol!=='driver')return;
  const ini=rango('mes')[0];const rs=S.r.filter(r=>r.ts>=ini);
  for(let i=0;i<rs.length;i+=400){const bt=db.batch();rs.slice(i,i+400).forEach(r=>bt.set(db.collection('flotas').doc(S.flota.id).collection('registros').doc(me.uid+'_'+r.id),Object.assign({},r,{choferUid:me.uid,choferNombre:S.cfg.nombre||'Chofer',vehiculo:S.cfg.vehiculo||''})));
    try{await bt.commit();}catch(e){}}}

/* ====== PWA ====== */
(function pwa(){
  const ic='data:image/svg+xml,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><rect width="512" height="512" rx="110" fill="#0b1220"/><text x="256" y="330" font-size="260" font-family="Arial" font-weight="800" fill="#22c55e" text-anchor="middle">M</text></svg>');
  const m={name:'manejAr',short_name:'manejAr',start_url:location.href.split('#')[0],display:'standalone',background_color:'#0b1220',theme_color:'#0b1220',icons:[{src:ic,sizes:'any',type:'image/svg+xml',purpose:'any'}]};
  try{const l=document.createElement('link');l.rel='manifest';l.href=URL.createObjectURL(new Blob([JSON.stringify(m)],{type:'application/json'}));document.head.appendChild(l);}catch(e){}
  if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw-manejar.js').catch(()=>{});
})();

/* ====== ARRANQUE ====== */
applyTema();render();
setTimeout(()=>{const s=$('#splash');s.style.opacity='0';setTimeout(()=>s.remove(),500);},1300);
setInterval(()=>{
  if(FB_ON&&gate==='app'&&!acceso().ok){evaluarAcceso();return;}
  if(tab==='flota'||tab==='inicio')render();},60000);
fbInit();
</script>
